<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>线粒体蛋白荧光强度分析</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        
        .upload-section {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 20px;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .file-label {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        
        .file-label:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .param-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        
        .param-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        
        .analyze-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
            display: none;
        }
        
        .result-section.show {
            display: block;
        }
        
        .result-item {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        
        .result-label {
            font-weight: 600;
            color: #667eea;
        }
        
        .result-value {
            color: #333;
        }
        
        .visualization {
            margin-top: 20px;
            text-align: center;
        }
        
        .visualization img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .file-info {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔬 线粒体蛋白荧光强度分析</h1>
        <p class="subtitle">Mitochondrial Protein Fluorescence Intensity Analysis</p>
        
        <div class="upload-section">
            <div class="upload-icon">📁</div>
            <p>点击选择 CZI 文件</p>
            <input type="file" id="fileInput" accept=".czi">
            <label for="fileInput" class="file-label">选择文件</label>
            <div class="file-info" id="fileInfo"></div>
        </div>
        
        <div class="param-section">
            <h3 style="margin-bottom: 15px; color: #667eea;">⚙️ 分析参数</h3>
            
            <div class="param-group">
                <label for="mitoChannel">线粒体通道索引 (Mitochondrial Channel)</label>
                <input type="number" id="mitoChannel" value="0" min="0">
            </div>
            
            <div class="param-group">
                <label for="targetChannel">目标蛋白通道索引 (Target Protein Channel)</label>
                <input type="number" id="targetChannel" value="2" min="0">
            </div>
            
            <div class="param-group">
                <label for="thresholdMethod">阈值分割方法 (Threshold Method)</label>
                <select id="thresholdMethod">
                    <option value="otsu">Otsu (适用于双峰分布)</option>
                    <option value="li">Li (基于最小交叉熵)</option>
                    <option value="yen">Yen (适用于低对比度)</option>
                </select>
            </div>
            
            <div class="param-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="generateViz">
                    <label for="generateViz">生成可视化图像</label>
                </div>
            </div>
        </div>
        
        <button class="analyze-btn" id="analyzeBtn" disabled>开始分析</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在分析中，请稍候...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="result-section" id="results">
            <h3 style="margin-bottom: 15px; color: #667eea;">📊 分析结果</h3>
            <div id="resultContent"></div>
            <div class="visualization" id="visualization"></div>
        </div>
    </div>
    
    <script>
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const resultContent = document.getElementById('resultContent');
        const visualization = document.getElementById('visualization');
        
        let selectedFile = null;
        
        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                fileInfo.textContent = `已选择: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
                analyzeBtn.disabled = false;
            }
        });
        
        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            // 隐藏之前的结果和错误
            results.classList.remove('show');
            error.classList.remove('show');
            
            // 显示加载状态
            loading.classList.add('show');
            analyzeBtn.disabled = true;
            
            // 准备表单数据
            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('mitochondrial_channel', document.getElementById('mitoChannel').value);
            formData.append('target_protein_channel', document.getElementById('targetChannel').value);
            formData.append('threshold_method', document.getElementById('thresholdMethod').value);
            formData.append('generate_visualization', document.getElementById('generateViz').checked);
            
            try {
                const response = await fetch('http://localhost:8000/analyze', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result.data);
                } else {
                    showError(result.error || result.message);
                }
                
            } catch (err) {
                showError('网络错误: ' + err.message);
            } finally {
                loading.classList.remove('show');
                analyzeBtn.disabled = false;
            }
        });
        
        function displayResults(data) {
            resultContent.innerHTML = `
                <div class="result-item">
                    <span class="result-label">文件名:</span>
                    <span class="result-value">${data.FileName}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">平均荧光强度:</span>
                    <span class="result-value">${data.Average_Intensity_in_Mitochondria.toFixed(2)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">总荧光强度:</span>
                    <span class="result-value">${data.Total_Intensity_in_Mitochondria.toFixed(2)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">线粒体像素数:</span>
                    <span class="result-value">${data.Mitochondrial_Pixels_Count}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">线粒体平均强度:</span>
                    <span class="result-value">${data.Mitochondrial_Average_Intensity.toFixed(2)}</span>
                </div>
                <div class="result-item">
                    <span class="result-label">掩膜覆盖率:</span>
                    <span class="result-value">${data.Mask_Coverage_Percentage.toFixed(2)}%</span>
                </div>
                <div class="result-item">
                    <span class="result-label">阈值:</span>
                    <span class="result-value">${data.Threshold_Value.toFixed(2)}</span>
                </div>
            `;
            
            // 显示可视化图像
            if (data.visualization) {
                visualization.innerHTML = `
                    <h4 style="margin-bottom: 10px;">可视化图像</h4>
                    <img src="data:image/png;base64,${data.visualization}" alt="Analysis Visualization">
                `;
            } else {
                visualization.innerHTML = '';
            }
            
            results.classList.add('show');
        }
        
        function showError(message) {
            error.textContent = '错误: ' + message;
            error.classList.add('show');
        }
    </script>
</body>
</html>
