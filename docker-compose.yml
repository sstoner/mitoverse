version: '3.8'

services:
  # 后端 API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitoverse-api
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - CORS_ORIGINS=http://localhost:3000,https://yourdomain.com
    volumes:
      # 开发模式：挂载代码实现热重载
      - ./analyzer.py:/app/analyzer.py
      - ./api.py:/app/api.py
      # 挂载临时文件目录
      - ./uploads:/tmp/uploads
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: mitoverse-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    restart: unless-stopped
    profiles:
      - production

volumes:
  uploads:
    driver: local
